name: Multi-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: make deps
      
      - name: Build for Linux
        run: make release
      
      - name: Test build
        run: make test
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-linux-x64
          path: |
            kuyil
            libs/*.so

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install MinGW-w64
        run: make deps-cross-windows
      
      - name: Build for Windows (64-bit)
        run: make cross-windows
      
      - name: Upload Windows 64-bit binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-windows-x64
          path: |
            kuyil.exe
            libs/*.dll
      
      - name: Build for Windows (32-bit)
        run: make cross-windows-32
      
      - name: Upload Windows 32-bit binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-windows-x86
          path: |
            kuyil-win32.exe
            libs/*-win32.dll

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: make deps-mac
      
      - name: Build for macOS (Intel)
        run: |
          make clean
          make CC=clang TARGET=kuyil-x86_64 CFLAGS="-Wall -Wextra -std=c99 -O2 -g -fPIC -arch x86_64 -mmacosx-version-min=10.13" LIBS="-lcurl -lpthread -lm -ldl"
          clang -Wall -Wextra -std=c99 -O2 -g -fPIC -arch x86_64 -mmacosx-version-min=10.13 src/main.c src/vm.c src/logging.c src/config.c src/ffi.c src/file_reader.c src/green_threads.c src/library_loader.c src/vm_library_integration.c -o kuyil-x86_64 -lcurl -lpthread -lm -ldl
      
      - name: Upload macOS Intel binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-macos-x86_64
          path: |
            kuyil-x86_64
            libs/*.dylib

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: make deps-mac
      
      - name: Build for macOS (Apple Silicon)
        run: make macos-arm64
      
      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-macos-arm64
          path: |
            kuyil-arm64
            libs/*.dylib

  build-macos-universal:
    runs-on: macos-latest
    needs: [build-macos-intel, build-macos-arm64]
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: make deps-mac
      
      - name: Download Intel binary
        uses: actions/download-artifact@v3
        with:
          name: kuyil-macos-x86_64
          path: ./intel
      
      - name: Download ARM64 binary
        uses: actions/download-artifact@v3
        with:
          name: kuyil-macos-arm64
          path: ./arm64
      
      - name: Create Universal Binary
        run: |
          chmod +x ./intel/kuyil-x86_64 ./arm64/kuyil-arm64
          lipo -create ./intel/kuyil-x86_64 ./arm64/kuyil-arm64 -output kuyil
          chmod +x kuyil
          file kuyil
          lipo -info kuyil
      
      - name: Upload macOS Universal binary
        uses: actions/upload-artifact@v3
        with:
          name: kuyil-macos-universal
          path: |
            kuyil
            libs/*.dylib

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kuyil-linux-x64/**
            kuyil-windows-x64/**
            kuyil-windows-x86/**
            kuyil-macos-universal/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
