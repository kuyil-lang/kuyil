# Kuyil Shared Libraries Configuration
# Format: library_name:path:optional[true/false]
#
# This file defines which shared libraries should be loaded by the Kuyil VM
# Lines starting with # are comments
# Empty lines are ignored

# Core default libraries (required)
math:./libs/libkylmath.so:false
str:./libs/libkylstr.so:false
http:./libs/libkylhttp.so:false
datetime:./libs/libkyldatetime.so:false

# WebView library for desktop applications (in additional_libs)
webview:./libs/libkylwebview.so:true

# Crypto utilities library
crypto:./shared_libs/crypto/libcrypto_utils.so:true

# Compression utilities library  
compression:./shared_libs/transcoder/libcompression_utils.so:true

# SQLite database library
sqlite:./shared_libs/sqlite/libsqlite_utils.so:true

# HTTP client library
http:./shared_libs/http/libhttp_utils.so:true

# File I/O utilities library
fileio:./libs/libfileio_utils.so:false

# Math utilities library
math:./shared_libs/math/libmath_utils.so:true

# System utilities library
system:./shared_libs/system/libsystem_utils.so:true

# RPC library for Thrift and Protobuf support
rpc:./shared_libs/rpc/librpc_utils.so:true